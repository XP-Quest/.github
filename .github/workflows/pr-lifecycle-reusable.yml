name: pr-lifecycle (reusable)

# Org-wide closing-keyword guard for PRs into a repo's integration branch, where
# issues close: `dev` in the deployable repos (closed by close-on-merge-reusable
# .yml), `main` in the single-track ones (closed by GitHub). Called by a thin
# `pr-lifecycle.yml` caller in each repo. A PR without a keyword in its body
# merges without closing its issue. `N-trivial-fixes` branches are exempt: their
# standing issue never closes.
#
# Reusable workflows inherit the caller's `github` context, so the caller's
# `pull_request` event payload (`github.event.pull_request.body`) is available
# here without passing it as an input.
#
# Advisory only on the free tier (no branch protection) — a red run is a reminder
# to add the keyword, not a hard block.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  closing-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Require a closing keyword in the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          if [[ "$HEAD_REF" =~ ^[0-9]+-trivial-fixes$ ]]; then
            echo "Trivial-fixes branch: no closing keyword required."
            exit 0
          fi
          # Mirror GitHub's own auto-close grammar: keyword, optional colon, then
          # a mandatory space (GitHub requires the space, so do not match a bare
          # `Closes:#NN`). Multiple spaces / tabs are fine.
          if grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' <<< "$BODY"; then
            echo "Closing keyword found."
          else
            echo "::error::PR body must contain a closing keyword (e.g. 'Closes #NN'). Merging this PR is the close point per SR_ED_CONVENTIONS \"When issues close\"."
            exit 1
          fi
